      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Сборка APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Подготовить файл
        run: cp project/app/build/outputs/apk/debug/app-debug.apk AutoBundel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoBundel-apk
          path: AutoBundel.apk

      - name: Опубликовать для скачивания
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-$GITHUB_RUN_NUMBER" AutoBundel.apk --repo "$GITHUB_REPOSITORY" --title "Авто-bundel, сборка $GITHUB_RUN_NUMBER" --notes "Откройте эту страницу на телефоне, скачайте AutoBundel.apk и установите."
